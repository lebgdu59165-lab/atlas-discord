# Un seul service gratuit ; PostgreSQL, Redis et le bot sont hébergés séparément.
# Les secrets sont saisis dans Render, jamais dans ce dépôt.
services:
  - type: web
    name: atlas-dashboard
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: node scripts/start-hosted.mjs web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OWNER_DISCORD_ID
        sync: false
      - key: DISCORD_MEMBERS_INTENT
        sync: false
      - key: DISCORD_MESSAGE_CONTENT_INTENT
        sync: false
      - key: DISCORD_PRESENCE_INTENT
        sync: false
